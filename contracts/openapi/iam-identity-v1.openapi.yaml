      operationId: webAdminServiceResourceOptions
      description: platform:service:write；返回目标企业修订和当前可授予的权限选项，不授予读取权
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResourceOptions'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      security:
      - sessionCookie: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-random-128
      description: 不透明随机令牌（random-128），服务端以 sha256 摘要在 PG 权威核验；Redis 仅作 Sa-Token 会话适配。
    internalClient:
      type: http
      scheme: bearer
      description: 登记内部客户端凭据，与subject_token分离；保留原Basic兼容，不互换主体令牌。
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-air_iam_session
      description: HttpOnly; Secure; SameSite=Lax 人类会话 cookie（开发名 air_iam_dev_session）。浏览器 JS 不可读，禁止镜像到 Bearer/存储。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 双提交 CSRF，配合 Origin/Referer 校验；登录态变更端点一律强制。

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Error400:
      description: 请求格式/字段错误
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Error401:
      description: 未认证或会话已撤销/过期
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Error403:
      description: 已认证但权限/受众/CSRF/Origin 不满足
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Error404:
      description: 资源不存在（或在当前 RLS 上下文中不可见）
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Error409:
      description: 修订冲突（context_changed）/重放/最后管理员等业务冲突
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Error429:
      description: 内部接口超时限流
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Error503:
      description: PG/Redis 依赖故障，失败关闭（不允许降级放行）
      headers:
        Cache-Control: { schema: { const: no-store } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    ResourceExpectedContext:
      type: object
      additionalProperties: false
      required:
      - session_id
      - tenant_id
      - ctx_version
      properties:
        session_id:
          type: string
          format: uuid
        tenant_id:
          type:
          - string
          - 'null'
          format: uuid
        ctx_version:
          type: integer
          minimum: 0
    CreateResourceRequest:
      type: object
      additionalProperties: false
      required:
      - expected_context
      - code
      - name_zh
      - permissions
      properties:
        expected_context:
          type: object
          additionalProperties: false
          required:
          - session_id
          - tenant_id
          - ctx_version
          properties:
            session_id:
              type: string
              format: uuid
            tenant_id:
              type:
              - string
              - 'null'
              format: uuid
            ctx_version:
              type: integer
              minimum: 0
        code:
          type: string
          pattern: ^[a-z][a-z0-9_-]*(:[a-z][a-z0-9_-]*)+$
          minLength: 3
          maxLength: 160
        name_zh:
          type: string
          minLength: 1
          maxLength: 100
        sort:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
        parent_code:
          type:
          - string
          - 'null'
        permissions:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - name_zh
            - grantable_to_tenants
            properties:
              code:
                type: string
                minLength: 3
                maxLength: 200
              name_zh:
                type: string
                minLength: 1
                maxLength: 100
              grantable_to_tenants:
                type: boolean
    UpdateResourceRequest:
      type: object
      additionalProperties: false
      required:
      - expected_context
      - expected_revision
      properties:
        expected_context:
          type: object
          additionalProperties: false
          required:
          - session_id
          - tenant_id
          - ctx_version
          properties:
            session_id:
              type: string
              format: uuid
            tenant_id:
              type:
              - string
              - 'null'
              format: uuid
            ctx_version:
              type: integer
              minimum: 0
        expected_revision:
          type: integer
          minimum: 1
        name_zh:
          type: string
          minLength: 1
          maxLength: 100
        sort:
          type: integer
        status:
          type: string
          enum:
          - active
          - disabled
    UpdateEntitlementRequest:
      type: object
      additionalProperties: false
      required:
      - expected_context
      - expected_revision
      - expected_tenant_revision
      - status
      properties:
        expected_context:
          type: object
          additionalProperties: false
          required:
          - session_id
          - tenant_id
          - ctx_version
          properties:
            session_id:
              type: string
              format: uuid
            tenant_id:
              type:
              - string
              - 'null'
              format: uuid
            ctx_version:
              type: integer
              minimum: 0
        expected_revision:
          type: integer
          minimum: 0
        expected_tenant_revision:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - active
          - revoked
    ResourceView:
      type: object
      required:
      - id
      - code
      - name_zh
      - sort
      - status
      - kind
      - parent_code
      - revision
      - permissions
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name_zh:
          type: string
        sort:
          type: integer
        status:
          enum:
          - active
          - disabled
        kind:
          const: leaf
        parent_code:
          type:
          - string
          - 'null'
        revision:
          type: integer
          minimum: 1
        permissions:
          type: array
          items:
            type: object
            required:
            - code
            - name_zh
            - scope
            - grantable_to_tenants
            - status
            - resource_code
            properties:
              code:
                type: string
              name_zh:
                type: string
              scope:
                const: tenant
              grantable_to_tenants:
                type: boolean
              status:
                enum:
                - active
                - disabled
              resource_code:
                type: string
    EntitlementView:
      type: object
      required:
      - tenant_id
      - resource_code
      - resource_name_zh
      - status
      - revision
      - exists
      - resource_status
      - effective
      - tenant_auth_revision
      - changed
      - granted_at
      - revoked_at
      - updated_at
      - updated_by
      properties:
        tenant_id:
          type: string
          format: uuid
        resource_code:
          type: string
        resource_name_zh:
          type: string
          description: 资源目录中文名，用于中文管理界面的业务/资源展示
        status:
          enum:
          - active
          - revoked
        revision:
          type: integer
          minimum: 0
        exists:
          type: boolean
        resource_status:
          enum:
          - active
          - disabled
        effective:
          type: boolean
        tenant_auth_revision:
          type: integer
        changed:
          type: boolean
        granted_at:
          type:
          - string
          - 'null'
        revoked_at:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
        updated_by:
          type:
          - string
          - 'null'
    ServiceResourceOptions:
      type: object
      required:
      - tenant_id
      - tenant_auth_revision
      - permissions
      properties:
        tenant_id:
          type: string
          format: uuid
        tenant_auth_revision:
          type: integer
        permissions:
          type: array
          items:
            type: object
            required:
            - code
            - name_zh
            - resource_code
            properties:
              code:
                type: string
              name_zh:
                type: string
              resource_code:
                type:
                - string
                - 'null'
    ResourcePage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceView'
        next_cursor:
          type:
          - string
          - 'null'
    EntitlementPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementView'
        next_cursor:
          type:
          - string
          - 'null'

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthenticated, forbidden, not_found, context_changed, conflict, rate_limited, dependency_unavailable, csrf_rejected, sso_rejected]
            message: { type: string }
            request_id: { type: string }
            details: { type: object, description: "禁止携带口令/令牌/密钥片段" }

    Identity:
      type: object
      additionalProperties: false
      required: [schema_version, active, issuer, audience, principal, user, session, current_tenant, membership, platform_roles, tenant_roles, permissions, revisions, context_version, platform_admin, context_usable, needs_tenant_selection, evaluated_at]
      properties:
        schema_version: { const: iam.identity.v1 }
        active: { type: boolean }
        issuer: { type: string }
        audience: { enum: [air-agent, knowledge, iam-admin, langgraph-runtime] }
        principal:
          type: object
          additionalProperties: false
          required: [type, id, realm]
          properties:
            type: { const: human }
            id: { type: string, format: uuid }
            realm: { const: workforce }
        user:
          type: ["object", "null"]
          required: [id, account, display_name, status]
          properties:
            id: { type: string, format: uuid }
            account: { type: string }
            display_name: { type: string }
            status: { enum: [active, disabled] }
        session: { $ref: "#/components/schemas/Session" }
        current_tenant:
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Tenant" }]
        membership:
          oneOf:
            - { type: "null" }
            - type: object
              required: [id, tenant_id, status, revision]
              properties:
                id: { type: string, format: uuid }
                tenant_id: { type: string, format: uuid }
                department_id: { type: ["string", "null"], format: uuid }
                status: { enum: [active, disabled] }
                revision: { type: integer, minimum: 1 }
        platform_roles:
          type: array
          items: { type: object, required: [code, name], properties: { code: { type: string }, name: { type: string } } }
        tenant_roles:
          type: array
          items: { type: object, required: [code, name], properties: { code: { type: string }, name: { type: string } } }
        permissions:
          type: array
          items: { type: string }
          description: >-
            当前企业上下文中的实时有效权限码，精确字符串匹配。Agent 业务使用码为
            agent:business:&lt;code&gt;:use，必须同时满足企业开通与本人企业角色授予；
            非资源型 Agent 查看码（如 agent:operations:read）按原分级授予，不以业务前缀推断。
        revisions: { $ref: "#/components/schemas/Revisions" }
        context_version: { type: integer, minimum: 1 }
        platform_admin: { type: boolean }
        context_usable: { type: boolean }
        needs_tenant_selection: { type: boolean }
        evaluated_at: { type: string, format: date-time }

    InactiveIntrospection:
      type: object
      additionalProperties: false
      required: [schema_version, active, reason, evaluated_at]
      properties:
        schema_version: { const: iam.introspection.v1 }
        active: { const: false }
        reason: { enum: [invalid_or_revoked, account_disabled, tenant_suspended, membership_disabled, context_required] }
        evaluated_at: { type: string, format: date-time }

    Session:
      type: ["object", "null"]
      required: [id, ctx_version, created_at, expires_at, absolute_expires_at, idle_expires_at]
      properties:
        id: { type: string, format: uuid }
        ctx_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        absolute_expires_at: { type: string, format: date-time }
        idle_expires_at: { type: ["string", "null"], format: date-time }

    SessionTimers:
      type: object
      required: [absolute_expires_at, idle_expires_at]
      properties:
        absolute_expires_at: { type: string, format: date-time }
        idle_expires_at: { type: ["string", "null"], format: date-time }

    Revisions:
      type: object
      additionalProperties: false
      required: [user_auth_revision, tenant_auth_revision, membership_revision, session_ctx_version]
      properties:
        user_auth_revision: { type: integer, minimum: 0 }
        tenant_auth_revision: { type: integer, minimum: 0 }
        membership_revision: { type: integer, minimum: 0 }
        session_ctx_version: { type: integer, minimum: 1 }

    Tenant:
      type: object
      required: [id, code, name, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { enum: [active, suspended] }

    TenantMembershipSummary:
      type: object
      required: [tenant_id, code, name, status, is_owner]
      properties:
        tenant_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { enum: [active, suspended] }
        is_owner: { type: boolean }
        member_status: { enum: [active, disabled] }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [account, password, realm, audience]
      properties:
        account: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 256 }
        realm: { const: workforce }
        audience: { enum: [air-agent, knowledge, iam-admin] }

    LoginResult:
      type: object
      required: [access_token, token_type, expires_in, identity]
      properties:
        access_token: { type: string, description: 仅 /v1 机内使用；/web-api 登录不返回此字段 }
        token_type: { const: Bearer }
        expires_in: { type: integer }
        identity: { $ref: "#/components/schemas/Identity" }

    SwitchTenantRequest:
      type: object
      required: [tenant_id, expected_ctx_version]
      properties:
        tenant_id: { type: string, format: uuid }
        expected_ctx_version: { type: integer, minimum: 1 }

    RenewRequest:
      type: object
      required: [expected_ctx_version]
      properties:
        expected_ctx_version: { type: integer, minimum: 1 }

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 256 }

    IntrospectRequest:
      type: object
      oneOf:
        - required: [subject_token, audience]
        - required: [execution_context, audience]
      properties:
        subject_token: { type: string, minLength: 16 }
        execution_context:
          type: object
          required: [verification_ref, expected_revisions]
          properties:
            verification_ref: { type: string, format: uuid }
            expected_revisions: { $ref: "#/components/schemas/Revisions" }
        audience: { type: string }
        expected_context:
          type: object
          required: [tenant_id, ctx_version]
          properties:
            tenant_id: { type: string, format: uuid }
            ctx_version: { type: integer, minimum: 1 }
        include_execution_context: { type: boolean }

    RuntimeTicketRequest:
      type: object
      required: [subject_token, audience, target_tenant_id, expected_ctx_version]
      properties:
        subject_token: { type: string, minLength: 16 }
        audience: { const: langgraph-runtime }
        target_tenant_id: { type: string, format: uuid }
        expected_ctx_version: { type: integer, minimum: 1 }

    SsoExchangeRequest:
      type: object
      required: [ticket, redirect_uri]
      properties:
        ticket: { type: string, minLength: 16 }
        redirect_uri: { type: string, format: uri }

    MenuTree:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
              permission: { type: ["string", "null"] }
              children: { type: array, items: { type: object } }

    # ===== 第5组：管理 API 具体 schema（任何视图均不含 password_hash/令牌/密钥材料）=====

    UserView:
      type: object
      required: [id, realm, account, display_name, status, auth_revision, platform_roles, created_at]
      properties:
        id: { type: string, format: uuid }
        realm: { type: string, enum: [workforce, service] }
        account: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [active, disabled] }
        auth_revision: { type: integer, minimum: 0, description: 新建=0；仅改资料不推进 }
        platform_roles: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }

    CreateUserRequest:
      type: object
      required: [account, password]
      properties:
        account: { type: string, minLength: 3, maxLength: 64 }
        display_name: { type: string }
        password: { type: string, minLength: 8, maxLength: 256, description: 强度校验；bcrypt $2b$ 存储 }

    UpdateUserRequest:
      type: object
      required: [expected_revision]
      properties:
        display_name: { type: string }
        status: { type: string, enum: [active, disabled] }
        expected_revision: { type: integer, minimum: 0 }

    ResetPasswordRequest:
      type: object
      required: [new_password, expected_revision]
      properties:
        new_password: { type: string, minLength: 8, maxLength: 256 }
        expected_revision: { type: integer, minimum: 0 }

    PlatformRolesRequest:
      type: object
      required: [role_codes, expected_revision]
      properties:
        role_codes: { type: array, items: { type: string } }
        expected_revision: { type: integer, minimum: 0 }

    UserPage:
      type: object
      required: [items]
      properties:
        next_cursor: { type: ["string", "null"] }
        items: { type: array, items: { $ref: "#/components/schemas/UserView" } }

    TenantView:
      type: object
      required: [id, code, name, status, auth_revision, created_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        auth_revision: { type: integer, minimum: 1, description: 新建=1（建档触发器推进） }
        created_at: { type: string, format: date-time }

    CreateTenantRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }

    UpdateTenantRequest:
      type: object
      required: [expected_revision]
      properties:
        name: { type: string }
        status: { type: string, enum: [active, suspended] }
        expected_revision: { type: integer, minimum: 1 }

    TenantPage:
      type: object
      required: [items]
      properties:
        next_cursor: { type: ["string", "null"] }
        items: { type: array, items: { $ref: "#/components/schemas/TenantView" } }

    MemberView:
      type: object
      required: [id, tenant_id, user, status, revision, roles]
      properties:
        id: { type: string, format: uuid, description: membership_id }
        tenant_id: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/UserView" }
