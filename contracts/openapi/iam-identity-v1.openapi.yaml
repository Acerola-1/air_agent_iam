        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      security:
      - sessionCookie: []
    parameters:
    - name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  /web-api/admin/tenants/{tenant_id}/entitlements/{resource_code}:
    put:
      tags:
      - admin
      operationId: webAdminUpdateEntitlement
      description: entitlement:manage；先校验上下文和两个修订再判断幂等；changed=false不推进修订或变更审计
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementView'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
